<!DOCTYPE html>
<html>
<head>
    <title>Eliminar Empleado</title>
</head>
<body>
    <h1>¿Estás seguro de que quieres eliminar a {{ empleado.nombres }} {{ empleado.apellidos }}?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Eliminar</button>
    </form>
    <a href="{% url 'empleado_list' %}">Cancelar</a>
</body>
</html>
